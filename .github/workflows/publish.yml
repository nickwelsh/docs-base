name: CI and npm publishing

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Verify release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('packages/docs/package.json', 'utf8'));
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Release tag must match the package version');
          NODE
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - run: pnpm pack:check
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'release' && matrix.node == 24
        with:
          name: npm-package
          path: artifacts/nickwelsh-docs-base-*.tgz
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12
      - uses: actions/download-artifact@v8
        with:
          name: npm-package
          path: artifacts
      - name: Stage verified tarball
        env:
          NPM_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm stage publish ./artifacts/nickwelsh-docs-base-*.tgz --access public --tag "$NPM_TAG"
